[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plancraft"
version = "0.1.0"
description = "Pluggable plan, feature gating, and billing engine for SaaS applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jessin Palackal" }]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
fastapi  = ["fastapi>=0.100", "sqlalchemy>=2.0"]
django   = ["django>=4.0"]
redis    = ["redis>=5.0"]
stripe   = ["stripe>=7.0"]
all      = ["plancraft[fastapi,redis,stripe]"]
dev      = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
